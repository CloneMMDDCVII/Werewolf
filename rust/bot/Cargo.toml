[package]
name = "bot"
version = "0.1.0"
edition.workspace = true
description = "Werewolf for Telegram: the bot binary (Telegram front end, game runner, storage wiring)"

[[bin]]
name = "werewolf-bot"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
game-engine = { path = "../game-engine" }
control = { path = "../control" }
i18n = { path = "../i18n" }
db = { path = "../db" }
moderation = { path = "../moderation" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# rustls instead of the default native-tls: no OpenSSL to install on
# Linux, so the binary runs on a bare machine.
teloxide = { version = "0.17", default-features = false, features = ["rustls", "ctrlc_handler"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
