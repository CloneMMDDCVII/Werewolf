name: Rust

on:
  push:
    branches: [master]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The db crate's tests run every storage scenario against SQLite and,
      # when WEREWOLF_TEST_POSTGRES_URL is set, against this server too.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wolf
          POSTGRES_PASSWORD: wolf
          POSTGRES_DB: werewolf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wolf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEREWOLF_TEST_POSTGRES_URL: postgres://wolf:wolf@localhost:5432/werewolf_test
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --locked
